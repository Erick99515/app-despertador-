name: Gerar APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar projeto Android
        run: |
          unzip -o despertador-app.zip -d fonte
          mkdir www && cp fonte/index.html www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Despertador com.despertador.app --web-dir www
          npx cap add android
          python3 fonte/preparar.py
          npx cap sync android
      - name: Chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          cp fonte/debug.keystore ~/.android/debug.keystore
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: despertador-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
